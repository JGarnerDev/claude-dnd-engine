/* Layout: one full-screen boss title card, shown by screen share on Tithe's scream (S2_TITHE_HUNTS).
   The painting on the left with its credit under it, the name on the right; stacked on a phone.
   Name and epithet only: no stats, no HP.
   Art: "Goldmane Griffin" by Paul Canavan, for Magic: The Gathering (Wizards of the Coast),
   https://www.artstation.com/artwork/L2JoWr. Credited, not licensed:
   fine for the table, ask the artist before posting it anywhere public. */
:root {
  --bg: #e9e4d8;
  --ink: #23221f;
  --muted: #615d55;
  --rule: #b49a5e;
  --accent: #8a6a24;
  --frame: #2b2620;
  --display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body: "Spectral", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12110e; --ink: #ece4d0; --muted: #a39a86; --rule: #6e5a2c; --accent: #d4a94a; --frame: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12110e; --ink: #ece4d0; --muted: #a39a86; --rule: #6e5a2c; --accent: #d4a94a; --frame: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  display: grid; place-items: center; padding: 16px; overflow: hidden;
}
.stage {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
  gap: clamp(1.5rem, 5vw, 5rem); max-width: 100%; max-height: 100%;
}
figure { margin: 0; display: grid; gap: .5rem; justify-items: start; min-width: 0; }
.art {
  display: block; width: min(58vw, 1100px); height: auto; max-width: 100%; max-height: 80vh; object-fit: contain;
  border: 1px solid var(--rule); box-shadow: 0 18px 50px var(--frame);
}
figcaption { color: var(--muted); font-size: .85rem; font-style: italic; }
figcaption a { color: inherit; text-underline-offset: 2px; }
figcaption a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { text-align: center; display: grid; gap: 1.2rem; justify-items: center; min-width: 0; }
.kicker {
  font-family: var(--display); color: var(--accent); letter-spacing: .4em;
  font-size: clamp(.9rem, 2vw, 1.4rem); margin: 0; padding-left: .4em;
}
h1 {
  font-family: var(--display); font-weight: 400; margin: 0; line-height: 1;
  font-size: clamp(3.5rem, 12vw, 11rem); letter-spacing: .06em;
}
.rule { width: min(40vw, 28rem); height: 1px; background: var(--rule); }
.epithet {
  font-style: italic; color: var(--muted); margin: 0;
  font-size: clamp(1.2rem, 3vw, 2.4rem);
}
@media (max-width: 760px), (orientation: portrait) {
  body { overflow: auto; }
  .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; }
  figure { justify-items: center; }
  .art { width: min(100%, 640px); }
}
@media (prefers-reduced-motion: no-preference) {
  .art { animation: arrive 1.3s cubic-bezier(.2, .7, .25, 1) both; }
  .card > * { animation: rise 1.4s ease-out both; }
  .card > :nth-child(1) { animation-delay: .5s; }
  .card > :nth-child(2) { animation-delay: .7s; }
  .card > :nth-child(3) { animation-delay: 1s; }
  .card > :nth-child(4) { animation-delay: 1.3s; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-40px) scale(1.06); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
}
</style>
