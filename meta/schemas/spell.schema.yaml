# spell.schema.yaml -- type: spell (prose: spell.md). Extends entity.schema.yaml.
$schema: https://json-schema.org/draft/2020-12/schema
title: spell
type: object
required: [state, level, school, casting_time, range, components, duration, concentration, effect]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: spell}
  state: {enum: [known, forbidden]}
  level:
    description: 0 for a cantrip, 1-9 for leveled spells.
    type: integer
    minimum: 0
    maximum: 9
  school:
    enum: [abjuration, conjuration, divination, enchantment, evocation, illusion, necromancy,
      transmutation]
  casting_time: {$ref: entity.schema.yaml#/$defs/text}
  range: {$ref: entity.schema.yaml#/$defs/text}
  components:
    type: array
    minItems: 1
    uniqueItems: true
    items: {enum: [V, S, M]}
  duration: {$ref: entity.schema.yaml#/$defs/text}
  concentration: {type: boolean}
  effect: {$ref: entity.schema.yaml#/$defs/text}
  material_component: {$ref: entity.schema.yaml#/$defs/text}
  available_to:
    description: Classes (and feats such as Ritual Caster) that grant the spell.
    $ref: entity.schema.yaml#/$defs/text-list
unevaluatedProperties: false
