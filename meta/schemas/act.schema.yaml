# act.schema.yaml -- type: act (prose: act.md). Extends entity.schema.yaml.
$schema: https://json-schema.org/draft/2020-12/schema
title: act
type: object
x-doc:
  historian: [outcome, sessions_played]
  tags: [act/, campaign/]
  base: [campaign, relates_to, importance, active, last_updated, description]
required: [state, central_conflict, goal, opening_state, closing_state]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: act}
  state:
    enum: [draft, planned, active, completed, abandoned]
    x-states:
      draft: Being written, not ready to run
      planned: Finalized, queued up but not yet started
      active: Currently being played through
      completed: All missions resolved, act concluded
      abandoned: Dropped from the story
  central_conflict: {$ref: entity.schema.yaml#/$defs/text}
  goal: {$ref: entity.schema.yaml#/$defs/text}
  opening_state:
    description: What is true at the start of this act.
    $ref: entity.schema.yaml#/$defs/text
  closing_state:
    description: What is true when this act ends.
    $ref: entity.schema.yaml#/$defs/text
  missions:
    $ref: entity.schema.yaml#/$defs/annotated-links
    x-placeholder: ['"[[Mission Name]]"']
  themes: {$ref: entity.schema.yaml#/$defs/text-list}
  estimated_sessions: {type: integer, minimum: 1}
  # --- historian: added when the act completes ---
  outcome:
    description: What actually happened; win, loss, or something in between.
    $ref: entity.schema.yaml#/$defs/text
  sessions_played:
    description: Actual number of sessions.
    type: integer
    minimum: 0
unevaluatedProperties: false
