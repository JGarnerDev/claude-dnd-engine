# background.schema.yaml -- type: background (prose: background.md). Extends entity.schema.yaml.
$schema: https://json-schema.org/draft/2020-12/schema
title: background
type: object
x-doc:
  tags: [background]
  base: [importance, active, description]
required: [state, skill_proficiencies, feature]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: background}
  state:
    enum: [available, restricted, unavailable]
    x-states:
      available: Open to players without restriction
      restricted: Allowed with DM approval
      unavailable: Not permitted in this campaign
  skill_proficiencies:
    description: Exactly two skills.
    $ref: entity.schema.yaml#/$defs/text-list
  feature:
    description: Name of the background feature.
    $ref: entity.schema.yaml#/$defs/text
  tool_proficiencies:
    description: Tools, instruments, or gaming sets.
    $ref: entity.schema.yaml#/$defs/text-list
  language_proficiencies:
    description: e.g. "Any two languages", or "none".
    $ref: entity.schema.yaml#/$defs/text
  equipment:
    description: Starting equipment list.
    $ref: entity.schema.yaml#/$defs/text-list
  variants:
    description: Official variant names (e.g. Spy for Criminal)
    $ref: entity.schema.yaml#/$defs/text-list
  source:
    $ref: entity.schema.yaml#/$defs/text
    x-placeholder: PHB
unevaluatedProperties: false
