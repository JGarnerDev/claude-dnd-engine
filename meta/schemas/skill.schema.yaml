# skill.schema.yaml -- type: skill (prose: skill.md). Extends entity.schema.yaml.
$schema: https://json-schema.org/draft/2020-12/schema
title: skill
type: object
required: [state, ability, use_cases]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: skill}
  state: {enum: [available]}
  ability: {enum: [STR, DEX, CON, INT, WIS, CHA]}
  source: {$ref: entity.schema.yaml#/$defs/text}
  use_cases: {$ref: entity.schema.yaml#/$defs/text-list}
unevaluatedProperties: false
