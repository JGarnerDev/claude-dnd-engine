# creature.schema.yaml -- type: creature (prose: creature.md). Extends entity.schema.yaml.
# Named or campaign-specific creatures; reference stat blocks are type: monster.
$schema: https://json-schema.org/draft/2020-12/schema
title: creature
type: object
x-doc:
  tags: [creature]
required: [state, creature_type, challenge_rating, location]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: creature}
  state:
    enum: [alive, dead, dormant, imprisoned, transformed, unknown]
    x-states:
      alive: Active in the world
      dead: Confirmed destroyed or slain
      dormant: Sleeping, hibernating, or otherwise inactive
      imprisoned: Captured, bound, or otherwise contained
      transformed: Significantly altered — polymorphed, corrupted, etc.
      unknown: Status unclear
  creature_type:
    enum: [undead, beast, humanoid, aberration, celestial, fiend, monstrosity, dragon, construct,
      elemental, fey, giant, ooze, plant, other]
  challenge_rating:
    description: CR as a string ("5", "1/2"), or "TBD" / "unknown".
    type: string
    pattern: '^(\d+|1/[248]|TBD|unknown)$'
  location:
    description: A location link or a plain note.
    $ref: entity.schema.yaml#/$defs/text
    x-placeholder: '"[[Location Name]]"'
  size: {enum: [tiny, small, medium, large, huge, gargantuan]}
  alignment: {$ref: entity.schema.yaml#/$defs/text}
  breed:
    description: For animals with a known breed.
    $ref: entity.schema.yaml#/$defs/text
  personality: {$ref: entity.schema.yaml#/$defs/text}
  goals: {$ref: entity.schema.yaml#/$defs/text-list}
  motives: {$ref: entity.schema.yaml#/$defs/text-list}
  lair:
    description: Specific lair if distinct from location.
    $ref: entity.schema.yaml#/$defs/text
    x-placeholder: '"[[Location Name]]"'
  allies:
    $ref: entity.schema.yaml#/$defs/text-list
    x-placeholder: ['"[[Character or Creature Name]] (nature of relationship)"']
  enemies:
    $ref: entity.schema.yaml#/$defs/text-list
    x-placeholder: ['"[[Character or Faction Name]] (nature of conflict)"']
  tactics:
    description: Brief combat or behavioral notes.
    $ref: entity.schema.yaml#/$defs/text
  weaknesses:
    description: Narrative or mechanical vulnerabilities.
    $ref: entity.schema.yaml#/$defs/text
  stat_block:
    description: Link to an external stat block, or "inline" if appended to the body.
    $ref: entity.schema.yaml#/$defs/text
  affinity:
    description: Party companions only. Per-target liking, -10..+10; see meta/affinity.md.
    type: array
    items:
      type: string
      pattern: '^\[\[[^\]]+\]\] \([+-]?(10|\d)\)$'
    x-placeholder: ['"[[Owner or PC Name]] (n)"']
unevaluatedProperties: false
