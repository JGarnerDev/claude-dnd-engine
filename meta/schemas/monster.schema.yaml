# monster.schema.yaml -- type: monster (prose: monster.md). Extends entity.schema.yaml.
# Reference stat blocks from the books; a named or campaign-specific creature is type: creature.
$schema: https://json-schema.org/draft/2020-12/schema
title: monster
type: object
x-doc:
  tags:
    - monster
    - monster/<creature_type>
    - 'cr/<decimal>  # e.g. cr/0.25 for CR 1/4, cr/0.5 for CR 1/2, cr/5 for CR 5'
  base: [description]
required: [creature_type, challenge_rating]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: monster}
  creature_type:
    enum: [undead, beast, humanoid, aberration, celestial, fiend, monstrosity, dragon, construct,
      elemental, fey, giant, ooze, plant, other]
  challenge_rating:
    description: CR as a string, e.g. "5" or "1/2".
    type: string
    pattern: '^(\d+|1/[248])$'
  size: {enum: [tiny, small, medium, large, huge, gargantuan]}
  alignment: {$ref: entity.schema.yaml#/$defs/text}
  source:
    description: Book and page, e.g. "Monster Manual p.298".
    $ref: entity.schema.yaml#/$defs/text
  stat_block:
    description: URL, or "inline" if appended to the body.
    $ref: entity.schema.yaml#/$defs/text
  habitats:
    description: Environments where typically encountered.
    $ref: entity.schema.yaml#/$defs/text-list
  weaknesses:
    description: Damage vulnerabilities + special (sunlight, silver, running water)
    $ref: entity.schema.yaml#/$defs/text-list
  resistances:
    description: Damage resistances (e.g. "bludgeoning from nonmagical attacks")
    $ref: entity.schema.yaml#/$defs/text-list
  immunities:
    description: Damage immunities + condition immunities (e.g. "poison", "charmed")
    $ref: entity.schema.yaml#/$defs/text-list
  legendary:
    description: True if has legendary actions or lair actions.
    type: boolean
    x-placeholder: 'false'
  movement:
    description: Special movement with speed, e.g. "fly 60".
    $ref: entity.schema.yaml#/$defs/text-list
unevaluatedProperties: false
