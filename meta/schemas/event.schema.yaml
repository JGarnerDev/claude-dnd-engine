# event.schema.yaml -- type: event (prose: event.md; timeline rules: meta/events.md).
# Extends entity.schema.yaml.
$schema: https://json-schema.org/draft/2020-12/schema
title: event
type: object
x-doc:
  tags: [event/, 'event/battle  # use a more specific tag where applicable', region/]
required: [state, date, outcome, consequences]
allOf:
  - $ref: entity.schema.yaml
properties:
  type: {const: event}
  state:
    enum: [recent, historical, ancient, legendary, disputed, secret]
    x-states:
      recent: Within living memory
      historical: Known but not within living memory
      ancient: Known only through records or ruins
      legendary: May be mythologized or partially fictional
      disputed: Accounts conflict; truth unclear
      secret: Occurred but not publicly known
  date:
    description: In-world date, era or relative time, in prose.
    $ref: entity.schema.yaml#/$defs/text
  timeline_date:
    description: Plot key "YYYY[-MM[-DD]]", year may be negative or short (meta/events.md). Needs a numeric epoch (meta/calendar.md) to appear on the timeline. Omit when no date can be fixed.
    type: string
    pattern: '^-?\d+(-\d{1,2}(-\d{1,2})?)?$'
  outcome: {$ref: entity.schema.yaml#/$defs/text}
  consequences:
    description: What about the present world exists because of this.
    $ref: entity.schema.yaml#/$defs/text-list
  track:
    description: Lane override, "category" or "category:member" (meta/events.md). Omit to auto-fan.
    type: string
    pattern: '^(party|character|npc|antagonist|faction|continent|world|region)(:.+)?$'
  daypart:
    description: 'Sub-day tier. Spreads same-day beats on the interactive timeline so events minted at one session''s date don''t stack. See meta/calendar-template.md.'
    enum: [dawn, morning, midday, afternoon, evening, night, late]
  order:
    description: 1-based sequence among beats sharing a date and daypart; /recap assigns it in narrative order. Omit for big single-date events.
    type: integer
    minimum: 1
  participants:
    $ref: entity.schema.yaml#/$defs/annotated-links
    x-placeholder: ['"[[Entity Name]] (role)"']
  awareness: {enum: [widely-known, regional, local, party, secret, forgotten, disputed]}
unevaluatedProperties: false
